# Garage config for LOCAL DEVELOPMENT ONLY.
# rpc_secret and admin_token are injected via GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN
# from docker-compose.yml (dev-only values, never used outside a laptop).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
