name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: OpenAPI document and client types are up to date
        run: |
          pnpm openapi:export
          git diff --exit-code -- packages/contracts/openapi.json apps/web/src/lib/api/schema.d.ts

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install ffmpeg (prepare_media runs the real binary)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && ffmpeg -version | head -1

      - name: Integration tests
        run: pnpm test:integration

  e2e:
    name: E2E smoke test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install ffmpeg (prepare_media runs the real binary)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && ffmpeg -version | head -1

      # Same infrastructure as local dev: Postgres, Redis, Mailpit and Garage (S3), plus garage-init,
      # which creates the bucket with the CORS rules browser uploads need.
      - name: Start infrastructure (docker compose)
        run: pnpm infra:up

      - name: Local-dev environment (dev defaults match the compose services)
        run: cp .env.example .env

      - run: pnpm db:migrate

      - name: Install Chromium
        run: pnpm --filter @meeting-hub/web exec playwright install --with-deps chromium

      - name: E2E (starts the API, the worker and a production build of the web app)
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Infrastructure logs
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail=200

  docker:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [server, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: false
          tags: meeting-hub-${{ matrix.image }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: The worker image runs ffmpeg as non-root
        if: matrix.image == 'server'
        run: |
          docker run --rm --entrypoint sh meeting-hub-server:ci -c '
            set -e
            test "$(id -un)" = node
            ffmpeg -hide_banner -loglevel error -f lavfi -i sine=duration=2 \
              -ac 1 -ar 16000 -c:a aac -b:a 40k -f mp4 -y /tmp/t.m4a
            ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 /tmp/t.m4a
          '
