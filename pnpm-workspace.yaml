packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - '@types/node@24.19.1'
  - '@aws-sdk/client-s3@3.1145.0'

# Dependencies allowed (true) or explicitly denied (false) to run install scripts.
allowBuilds:
  esbuild: true
  # Prebuilt native msgpack used by BullMQ.
  msgpackr-extract: true
  # Native resolver used by eslint import resolution (checks its prebuilt binding).
  unrs-resolver: true
  # Optional native speedups pulled in by testcontainers' ssh2 dependency — not needed.
  cpu-features: false
  ssh2: false
  # Postinstall only prints a version check notice.
  protobufjs: false
  # Its postinstall would install git hooks; the root `prepare` script does that instead.
  simple-git-hooks: false
